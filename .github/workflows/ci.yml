name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify deploy artifacts
        run: |
          test -f dist/index.html
          test -f dist/CNAME
          test -f dist/favicon.ico
          test -f dist/images/profile.jpg
          grep -q 'sujay.io' dist/CNAME
